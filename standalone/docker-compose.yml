# Standalone AED demo in Docker: the server (frontend + API, standalone/Dockerfile) on PostgreSQL.
#
#   docker compose -f standalone/docker-compose.yml up --build -d      # then open http://127.0.0.1:8090
#   docker compose -f standalone/docker-compose.yml up -d aed-postgres  # only the database, server run with Python:
#   python standalone/server.py --db postgresql://aed:aed@127.0.0.1:5433/aed_demo
#
# Demo credentials only; the port is bound to localhost. Data survive restarts in the `aed-pgdata` volume
# (`docker compose -f standalone/docker-compose.yml down -v` removes them).
name: aed-demo

services:
  aed-postgres:
    image: postgres:16-alpine
    container_name: aed-postgres
    environment:
      POSTGRES_USER: aed
      POSTGRES_PASSWORD: aed
      POSTGRES_DB: aed_demo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - aed-pgdata:/var/lib/postgresql/data
      # second database for the automated tests (AED_TEST_DATABASE_URL)
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-aed-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aed -d aed_demo"]
      interval: 2s
      timeout: 3s
      retries: 30

  aed-server:
    build:
      context: ..
      dockerfile: standalone/Dockerfile
    image: aed-demo
    container_name: aed-server
    environment:
      AED_DATABASE_URL: postgresql://aed:aed@aed-postgres:5432/aed_demo
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      aed-postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  aed-pgdata:
