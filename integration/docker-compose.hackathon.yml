# Overlay for the portal's local stack: mounts the AED app into every container as `mcod/aed`
# and serves the static subpage. Run from the portal root, always together with docker-compose.local.yml:
#
#   docker compose -f docker-compose.local.yml -f hackathon/integration/docker-compose.hackathon.yml <command>
#
# Relative paths resolve against the portal root (directory of the first -f file).
# Requires hackathon/integration/portal.patch to be applied (INSTALLED_APPS + routes).

x-aed-volume: &aed-volume ./hackathon/backend/aed:/usr/src/mcod_backend/mcod/aed

services:
  mcod-local-tests:
    volumes: [*aed-volume]
  mcod-local-tests-api:
    volumes: [*aed-volume]
  mcod-local-tests-cms:
    volumes: [*aed-volume]
  mcod-local-admin:
    volumes: [*aed-volume]
  mcod-local-api:
    volumes: [*aed-volume]
  mcod-local-cms:
    volumes: [*aed-volume]
  mcod-local-celery:
    volumes: [*aed-volume]
  mcod-local-run:
    volumes: [*aed-volume]

  # Static subpage on http://localhost:8090 — /api/* is proxied to the Falcon API,
  # so the page and the API share one origin (no CORS needed).
  aed-frontend:
    image: nginx:1.27-alpine
    container_name: aed-frontend
    depends_on:
      - mcod-local-api
    ports:
      - "8090:80"
    volumes:
      - ./hackathon/frontend:/usr/share/nginx/html:ro
      # Portal mode: real API instead of the in-browser mock.
      - ./hackathon/integration/config.portal.js:/usr/share/nginx/html/config.js:ro
    configs:
      - source: aed-frontend-nginx
        target: /etc/nginx/conf.d/default.conf
    networks:
      backend:

configs:
  aed-frontend-nginx:
    content: |
      server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        location /api/ {
          proxy_pass http://mcod-local-api:8000/;
          proxy_set_header Host api.mcod.local;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
        }
      }
